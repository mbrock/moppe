    <title>Moppe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08100d;
      }

      canvas {
        display: block;
        outline: none;
      }

      #status {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        color: #dcebdd;
        font: 13px ui-monospace, monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="status">Loading Moppe…</div>
    <script>
      // The game fills the document once it starts (the SDL host's window);
      // until then this line says how the download is going.
      const status = document.getElementById("status")
      var Module = {
        canvas: document.getElementById("canvas"),
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
        setStatus: (text) => {
          if (text) status.textContent = text
        },
      }
    </script>
