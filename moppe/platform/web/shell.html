<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" href="data:," />
    <title>Moppe</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08100d;
        /* A finger on the game is the game's, never a scroll, a zoom, a
           selection, or a menu. */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        outline: none;
      }

      #status {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        color: #dcebdd;
        font: 13px ui-monospace, monospace;
        pointer-events: none;
      }

      /* A phone's controls (touch.js), inside the notch and the home bar:
         a stick wherever a thumb lands on the left half, the view under a
         finger on the right, and what the game offers to do. */
      #touch {
        --ink: 184, 219, 255;
        --left: env(safe-area-inset-left, 0px);
        --right: env(safe-area-inset-right, 0px);
        --top: env(safe-area-inset-top, 0px);
        --bottom: env(safe-area-inset-bottom, 0px);
        position: fixed;
        inset: 0;
        z-index: 5;
        touch-action: none;
      }

      #touch[hidden] {
        display: none;
      }

      #touch .zone {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
      }

      #touch .stick {
        left: 0;
      }

      #touch .look {
        right: 0;
      }

      #touch .stick-base,
      #touch .stick-knob,
      #touch .key {
        position: absolute;
        box-sizing: border-box;
        border: 1.5px solid rgba(var(--ink), 0.5);
        border-radius: 50%;
        background: rgba(var(--ink), 0.08);
      }

      #touch .stick-base,
      #touch .stick-knob {
        left: 0;
        top: 0;
        display: none;
        pointer-events: none;
      }

      #touch .stick-base {
        width: 124px;
        height: 124px;
        margin: -62px 0 0 -62px;
      }

      #touch .stick-knob {
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        background: rgba(var(--ink), 0.28);
      }

      #touch .shown {
        display: block;
      }

      #touch .key {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--size);
        height: var(--size);
        right: calc(var(--right) + var(--x));
        bottom: calc(var(--bottom) + var(--y));
        color: rgba(var(--ink), 0.8);
        font: 600 13px ui-sans-serif, system-ui, sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        touch-action: none;
      }

      #touch .key.held {
        background: rgba(var(--ink), 0.3);
      }

      /* Space under the right thumb, and above it what else there is to
         do just now, in words. */
      #touch .thumb {
        --size: 78px;
        --x: 22px;
        --y: 28px;
      }

      #touch .offers {
        position: absolute;
        right: calc(var(--right) + 22px);
        bottom: calc(var(--bottom) + 122px);
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-end;
        gap: 10px;
        pointer-events: none;
      }

      #touch .offer {
        position: static;
        width: auto;
        height: 40px;
        padding: 0 16px;
        border-radius: 20px;
        background: rgba(8, 16, 13, 0.35);
        font-size: 14px;
        white-space: nowrap;
        pointer-events: auto;
      }

      #touch .key[hidden] {
        display: none;
      }

      #touch .view,
      #touch .full {
        --size: 44px;
        bottom: auto;
        top: calc(var(--top) + 12px);
        font-size: 11px;
      }

      #touch .view {
        --x: 22px;
      }

      #touch .full {
        right: auto;
        left: calc(var(--left) + 22px);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="status">Loading Moppe…</div>
    <script>
      // The game fills the document once it starts (the SDL host's window);
      // until then this line says how the download is going.
      const status = document.getElementById("status")
      var Module = {
        canvas: document.getElementById("canvas"),
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
        setStatus: (text) => {
          if (text) status.textContent = text
        },
      }
    </script>
    <script async src="@MOPPE_WEB_PROGRAM@.js"></script>
  </body>
</html>
