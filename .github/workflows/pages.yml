# Builds the browser game (docs/web.md) and publishes it to GitHub Pages
# whenever master moves.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To replace the cached Nix store with a newer one.
  actions: write

# A newer push replaces a build still under way.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: 6.0.3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Nix supplies luv-shaderc, which lowers the shaders, and the
      # compiler the land is baked with.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true

      # The Nix store, as in release.yml: luv-shaderc and the shell the
      # land is baked in come back without being built or fetched.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-pages-${{ hashFiles('flake.lock', '**/*.nix') }}
          # The flake inputs, unpacked.
          paths: ~/.cache/nix
          purge: true
          purge-prefixes: nix-pages-
          purge-created: 0
          purge-primary-key: never

      - name: Install Ninja
        run: sudo apt-get install --yes ninja-build

      # Emscripten with what its first build makes and keeps in its cache:
      # the SDL3 and Dawn ports and the system libraries.
      - name: Find Emscripten
        id: emsdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git \
            "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      # The page carries its world's land, which only the terrain code
      # changes: a land baked for the same code is used again.
      - name: Find a baked land
        id: land
        uses: actions/cache@v4
        with:
          path: build-web/land-cache
          key: >-
            land-1024-play-123-${{ hashFiles('moppe/terrain/**',
            'moppe/map/**', 'moppe/spatial/**', 'moppe/game/land.*',
            'moppe/*.hh', 'third_party/core-math/**', 'CMakeLists.txt',
            'flake.lock') }}

      - name: Bake the land
        if: steps.land.outputs.cache-hit != 'true'
        run: |
          mkdir -p build-web/land-cache
          nix develop --command env \
            MOPPE_LAND_DIR="$PWD/build-web/land-cache" \
            tools/bake-land 1024 play 123

      - name: Build the page
        run: |
          nix build .#luv-shaderc --out-link "$RUNNER_TEMP/luv-shaderc"
          # Emscripten's folder has a cmake directory, which this runner's
          # make 4.3 would take for the cmake command; the real one's
          # folder comes first.
          cmake="$(dirname "$(command -v cmake)")"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/luv-shaderc/bin:$cmake:$PATH"
          make web

      - name: Lay out the site
        run: |
          mkdir site
          cp build-web/moppe.js build-web/moppe.wasm build-web/moppe.data \
            site/
          cp build-web/moppe.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
