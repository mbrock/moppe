# Builds the game for Linux, Windows, and macOS. Pushing a tag v* publishes
# them as a GitHub release; running it by hand only keeps them as the run's
# artifacts. Each executable carries its assets and the default world's land
# (MOPPE_EMBED_ASSETS), so the executable alone is the game; the archives
# add the licences.
#
#   Linux    moppe-linux-x86_64.tar.gz   the portable Steam Deck build
#                                        (docs/steam-deck.md): glibc 2.31,
#                                        the host's Vulkan driver
#   Windows  moppe-windows-x86_64.zip    cross-built on Linux with Zig
#                                        (moppe/platform/sdl/windows.nix)
#            moppe-windows-x86_64.exe    the same moppe.exe, alone
#   macOS    moppe-macos-arm64.zip       the app bundle, signed and notarized;
#                                        macOS 26 on Apple silicon (Metal 4)
name: Release

on:
  push:
    tags: ["v*"]
    # A tag's run may read master's caches but no other tag's, so a change
    # to what the builds are made of builds them on master too, to save the
    # Nix stores below for the next tag. Tags ignore the paths.
    branches: [master]
    paths:
      - flake.lock
      - "**/*.nix"
      - lands.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      macos_only:
        description: Qualify only the signed and notarized Mac app
        type: boolean
        default: false

permissions:
  contents: read
  # To replace a job's cached Nix store with a newer one.
  actions: write

# Nix supplies luv-shaderc, which lowers the shaders, on every runner. The
# Linux jobs keep their Nix stores in the Actions cache, keyed by what the
# builds are made of: the dependencies built from source (SDL, volk, Zig's
# runtimes, luv-shaderc) and the 600 MB fetched from cache.nixos.org come
# back at once, and only the game is built. A new key starts from an empty
# store, so the cache holds one build's store and nothing older.
jobs:
  linux:
    if: ${{ !inputs.macos_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ github.job }}-${{ hashFiles('flake.lock', '**/*.nix', 'lands.json') }}
          # The flake inputs, unpacked.
          paths: ~/.cache/nix
          save: ${{ github.ref_type != 'tag' }}
          purge: true
          purge-prefixes: nix-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build
        run: |
          nix build -L .#moppe-steamdeck
          cat result/verification.txt
          mkdir dist
          cp result/moppe-steamdeck.tar.gz dist/moppe-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    if: ${{ !inputs.macos_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ github.job }}-${{ hashFiles('flake.lock', '**/*.nix', 'lands.json') }}
          # The flake inputs, unpacked.
          paths: ~/.cache/nix
          save: ${{ github.ref_type != 'tag' }}
          purge: true
          purge-prefixes: nix-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build
        run: |
          nix build -L .#moppe-windows
          cat result/imports.txt
          mkdir dist
          cp result/moppe-windows-x86_64.zip result/moppe-windows-x86_64.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Restoring the whole store is slower on macOS than fetching it, so
      # only luv-shaderc is kept, as a binary cache of its closure, and the
      # flake is not evaluated when it is there.
      - name: Find luv-shaderc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/luv-shaderc-cache
          key: luv-shaderc-macos-${{ hashFiles('flake.lock') }}
      - name: Install the build tools
        run: |
          brew install ninja zstd
          cache="$RUNNER_TEMP/luv-shaderc-cache"
          if [[ -f "$cache/path" ]]; then
            shaderc="$(cat "$cache/path")"
            nix copy --no-check-sigs --from "file://$cache" "$shaderc"
          else
            shaderc="$(nix build -L --no-link --print-out-paths .#luv-shaderc)"
            nix copy --to "file://$cache" "$shaderc"
            echo "$shaderc" > "$cache/path"
          fi
          echo "$shaderc/bin" >> "$GITHUB_PATH"
      # The default world's published land, built into the game so the
      # first launch need not generate it.
      - name: Fetch the land
        run: |
          MOPPE_LAND_DIR="$RUNNER_TEMP/lands" tools/fetch-land
      # The last build directory saved on master: CMake's probes and the
      # SDL it fetched and compiled carry over, while everything from the
      # checkout, newer than its objects, is compiled again.
      - name: Name the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Find the last build
        uses: actions/cache/restore@v4
        with:
          path: build
          # A new runner image, with perhaps another Xcode, starts afresh.
          key: macos-build-${{ steps.image.outputs.version }}-${{ github.sha }}
          restore-keys: macos-build-${{ steps.image.outputs.version }}-
      - name: Prepare Developer ID keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/macos-ci-keychain
      - name: Test release packaging
        run: python3 scripts/macos-sign-release-tests.py
      - name: Fetch pinned Sparkle
        run: python3 scripts/sparkle-release.py fetch "$RUNNER_TEMP/sparkle"
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version=0.0.0
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DMOPPE_LANDS_DIR="$RUNNER_TEMP/lands" \
            -DMOPPE_EMBED_ASSETS=ON -DMOPPE_AUTO_UPDATES=ON \
            -DMOPPE_SPARKLE_ROOT="$RUNNER_TEMP/sparkle" \
            -DMOPPE_VERSION="$version" -DMOPPE_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          cmake --build build --target moppe
      - name: Keep the build
        if: github.ref_type != 'tag'
        uses: actions/cache/save@v4
        with:
          path: build
          key: macos-build-${{ steps.image.outputs.version }}-${{ github.sha }}
      - name: Sign, notarize, and staple
        run: python3 scripts/macos-sign-release.py build/moppe.app
      - name: Verify the moved download
        run: python3 scripts/test-macos-release.py build/moppe-macos-arm64.zip
      - name: Generate signed Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          mkdir -p dist
          cp build/moppe-macos-arm64.zip build/SHA256SUMS dist/
          python3 scripts/sparkle-release.py appcast dist/moppe-macos-arm64.zip "$RUNNER_TEMP/sparkle" "$GITHUB_REF_NAME"
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/luv-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/luv-certificate.p12"
      - name: Retain notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notarization
          path: build/notarization-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes
