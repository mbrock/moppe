name: Tests and world determinism

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ci-${{ hashFiles('flake.lock', '**/*.nix') }}
          paths: ~/.cache/nix
      - name: Check generation math
        run: |
          if grep -REn --include='*.cc' --include='*.hh' \
            --exclude=river_census.cc \
            'std::(sin|cos|tan|atan2?|exp|log2?|pow|hypot)[[:space:]]*\(' \
            moppe/terrain moppe/map; then
            echo 'Use correctly rounded generation math' >&2
            exit 1
          fi
      - name: Build and test
        run: |
          nix develop --command bash -euc '
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DMOPPE_BUILD_DEVELOPER_TOOLS=ON
            cmake --build build --target moppe-tests world-fingerprint
            ctest --test-dir build --output-on-failure
            tools/format --check
            MOPPE_THREADS=1 ./build/world-fingerprint 257 play 123 > /tmp/world-one
            MOPPE_THREADS=4 ./build/world-fingerprint 257 play 123 > /tmp/world-four
            diff -u tests/terrain/world-fingerprint-257.txt /tmp/world-one
            diff -u /tmp/world-one /tmp/world-four
          '

  fingerprint-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Build and compare fingerprint
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMOPPE_BUILD_DEVELOPER_TOOLS=ON -DBUILD_TESTING=OFF
          cmake --build build --target world-fingerprint
          MOPPE_THREADS=1 ./build/world-fingerprint 257 play 123 > "$RUNNER_TEMP/world"
          diff -u tests/terrain/world-fingerprint-257.txt "$RUNNER_TEMP/world"

  fingerprint-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            diffutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
      - name: Build and compare fingerprint
        shell: msys2 {0}
        run: |
          set -eu
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS=-march=x86-64-v3 -DCMAKE_CXX_FLAGS=-march=x86-64-v3 \
            -DMOPPE_BUILD_DEVELOPER_TOOLS=ON -DBUILD_TESTING=OFF
          cmake --build build --target world-fingerprint
          MOPPE_THREADS=1 ./build/world-fingerprint.exe 257 play 123 > build/world
          tr -d '\r' < build/world > build/world-lf
          tr -d '\r' < tests/terrain/world-fingerprint-257.txt > build/pin-lf
          diff -u build/pin-lf build/world-lf
